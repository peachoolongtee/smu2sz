        expect: {intent: ACCELERATE_RECEIPT, awaiting: true, reply_contains: ["0.85%"]}
      - text: "actually make it 0.8%"
        expect: {intent: ACCELERATE_RECEIPT, amended: true, awaiting: true, ops_count: 0, reply_contains: ["0.80%"]}
      - text: "actually make it 1%"
        expect: {intent: ACCELERATE_RECEIPT, amended: false, ops_count: 0, reply_contains: ["unchanged", "break-even"]}
      - text: "no, use invoice financing instead"
        expect: {intent: ACCELERATE_RECEIPT, amended: true, awaiting: true, ops_count: 0,
                 plan_kinds: [SUBMIT_INVOICE_FOR_FINANCING]}
      - text: "go ahead"
        expect: {intent: ACCELERATE_RECEIPT, ops: ["DRAW_FACILITY:EXECUTED", "SUBMIT_INVOICE_FOR_FINANCING:EXECUTED"]}

