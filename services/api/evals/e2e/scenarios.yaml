    turns:
      - text: "Evaluate EX07"
        expect: {intent: EVALUATE_OFFER, outcome: NO_VERDICT, codes_exact: [CONFLICTING_SOURCES], ops_count: 0}

  - id: S13_ex08_joint_offers
    title: "EX08: Buyer 1's package is accepted with the owner's approval; Buyer 2's then no longer fits the aggregate cap"
    tags: [EX08, EX08A, EX08B, concurrency]
    turns:
      - text: "Evaluate EX08A"
        expect: {intent: EVALUATE_OFFER, outcome: NEEDS_OWNER_APPROVAL, awaiting: true}
      - text: "go ahead"
        expect: {intent: EVALUATE_OFFER, ops: ["ACCEPT_OFFER:PENDING_APPROVAL"]}
      - text: "approve it"
        expect: {intent: APPROVE, ops: ["ACCEPT_OFFER:EXECUTED"]}
      - text: "Evaluate EX08B"
        expect: {intent: EVALUATE_OFFER, codes: [AGG_CONCESSION_EXCEEDED], ops_count: 0}

