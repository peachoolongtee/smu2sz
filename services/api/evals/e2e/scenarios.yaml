      - text: "What if we give Foshan 60-day terms?"
        expect: {intent: WHAT_IF, ops_count: 0, codes: [AGG_CONCESSION_EXCEEDED], reply_contains: ["nothing executed"]}
      - text: "如果给佛山下季度1%的返利呢？"
        expect: {intent: WHAT_IF, ops_count: 0}

