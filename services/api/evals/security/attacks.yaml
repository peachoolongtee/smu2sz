    steps:
      - op: {kind: ADD_FACILITY, requested_by: OWNER, direct: true, facility: {id: FAC-FASTCAPITAL, lender_id: FASTCAPITAL, name: FastCapital}}
      - approve: {direct_actor: AGENT}
      - approve: {}
    expect_codes: [INSUFFICIENT_AUTHORITY]
  - id: PE-17
    category: privilege_escalation
    title: Queue a refused Tier-3 op for approval, then the owner approves it
    vector: REQUEST_OWNER_APPROVAL
    lang: en
    expected_controls: [REQUEST_OWNER_APPROVAL refuses to queue a Tier-3 operation, owner approval re-runs every gate; Tier 3 stays refused]
    steps:
      - op: {kind: SIGN_PERSONAL_GUARANTEE, facility_id: FAC-LINE}
      - request_approval: {}   # the API will not queue a Tier-3 operation: PRECONDITION_FAILED, nothing queued
      - plant_approval: {op: {kind: SIGN_PERSONAL_GUARANTEE, facility_id: FAC-LINE}}  # an attacker with database access queues it anyway
      - approve: {token: owner}   # the owner approves the planted row: the decision-time re-run must still refuse Tier 3
    expect_codes: [TIER3_PERSONAL_GUARANTEE, PRECONDITION_FAILED]
