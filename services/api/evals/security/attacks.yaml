  - id: FR-13
    category: failure_recovery
    title: Malformed operation bodies
    vector: POST /operations
    lang: en
    expected_controls: [TypeAdapter validation before the executor, 422, nothing logged]
    steps:
      - raw: {body: {kind: DRAW_FACILITY, facility_id: FAC-LINE}}
      - raw: {body: "{not json"}
      - raw: {body: {kind: DRAW_FACILITY, op_id: FR13, idempotency_key: FR13, mandate_version: 1, requested_by: AGENT, day: 0, facility_id: FAC-LINE, amount_fen: -1000000}}
      - raw: {body: {kind: DRAW_FACILITY, op_id: FR13b, idempotency_key: FR13b, mandate_version: 1, requested_by: AGENT, day: 0, facility_id: FAC-LINE, amount_fen: 10000.5}}
      - raw: {body: {kind: DRAW_FACILITY, op_id: FR13c, idempotency_key: FR13c, mandate_version: 1, requested_by: AGENT, day: 0, facility_id: FAC-LINE, amount_fen: "1000000"}}
      - raw: {body: []}
  - id: FR-14
    category: failure_recovery
    title: Unknown operation kind (TRANSFER_FUNDS to a payee)
    vector: POST /operations
    lang: en
    expected_controls: [closed discriminated union of operation kinds]
    steps:
      - raw: {body: {kind: TRANSFER_FUNDS, op_id: FR14, idempotency_key: FR14, mandate_version: 1, requested_by: OWNER, day: 0, amount_fen: 20000000, payee_account: "6222021000001234"}, token: owner}
  - id: FR-15
    category: failure_recovery
    title: Unauthenticated POST /demo/reset wipes the ledger
    vector: demo control route
    lang: en
    setup:
      - op: {kind: DRAW_FACILITY, facility_id: FAC-LINE, amount_fen: 1000000}
      - op: {kind: SIGN_PERSONAL_GUARANTEE, facility_id: FAC-LINE}
    expected_controls: [POST /demo/reset requires the owner token (401 PRIVILEGE_ESCALATION) and is disabled outside the demo]
    steps:
