# ------------------------------------------------------------------ 4. privilege escalation
  - id: PE-01
    category: privilege_escalation
    title: requested_by OWNER in the body without the token, ADD_FACILITY
    vector: POST /operations
    lang: en
    expected_controls: [API downgrades an unauthenticated owner claim to AGENT, AddFacility by non-owner is Tier 3]
    steps:
      - op: {kind: ADD_FACILITY, requested_by: OWNER, facility: {id: FAC-FASTCAPITAL, lender_id: FASTCAPITAL, name: FastCapital, status: COMMITTED, rate_bp: 280}}
    expect_codes: [UNKNOWN_COUNTERPARTY]
  - id: PE-02
    category: privilege_escalation
    title: Wrong owner token for a known lender's facility
    vector: POST /operations with a guessed X-Owner-Token
    lang: en
    expected_controls: [constant-time token comparison, owner-only AddFacility]
    steps:
      - op: {kind: ADD_FACILITY, requested_by: OWNER, token: wrong, facility: {id: FAC-LINE2, lender_id: BANK-1, name: Second line}}
    expect_codes: [INSUFFICIENT_AUTHORITY]
  - id: PE-03
    category: privilege_escalation
    title: The published demo token against a deployment that set OWNER_TOKEN
    vector: POST /operations with X-Owner-Token demo-owner-token
    lang: en
    expected_controls: [OWNER_TOKEN overrides the demo value]
    steps:
      - op: {kind: ADD_FACILITY, requested_by: OWNER, token: demo, facility: {id: FAC-LINE2, lender_id: BANK-1, name: Second line}}
      - op: {kind: APPLY_FOR_FACILITY, facility_id: FAC-GGL, amount_fen: 20000000, requested_by: OWNER, token: demo}  # queues a Tier-2 request for the demo-token approval below to decide
      - approve: {token: demo}
    expect_codes: [INSUFFICIENT_AUTHORITY]
  - id: PE-04
    category: privilege_escalation
    title: Token with surrounding whitespace
    vector: POST /operations
    lang: en
    expected_controls: [exact token match]
    steps:
      - op: {kind: APPLY_FOR_FACILITY, facility_id: FAC-GGL, amount_fen: 20000000, requested_by: OWNER, token: padded}
      - approve: {token: padded}
  - id: PE-05
    category: privilege_escalation
    title: ADD_FACILITY as COUNTERPARTY
    vector: POST /operations
    lang: en
    expected_controls: [AddFacility by non-owner is Tier 3]
    steps:
      - op: {kind: ADD_FACILITY, requested_by: COUNTERPARTY, facility: {id: FAC-B1, lender_id: BUYER-1, name: Buyer credit}}
  - id: PE-06
    category: privilege_escalation
    title: Caller-supplied "tier" field to run a Tier-2 op as Tier 1
    vector: POST /operations
    lang: en
    expected_controls: [strict typed operations reject unknown fields, executor computes the tier]
    steps:
      - raw: {body: {kind: APPLY_FOR_FACILITY, op_id: PE06, idempotency_key: PE06, mandate_version: 1, requested_by: AGENT, day: 0, facility_id: FAC-GGL, amount_fen: 20000000, tier: TIER_1}}
      - raw: {body: {kind: APPLY_FOR_FACILITY, op_id: PE06b, idempotency_key: PE06b, mandate_version: 1, requested_by: AGENT, day: 0, facility_id: FAC-GGL, amount_fen: 20000000, approved: true}}
  - id: PE-07
    category: privilege_escalation
    title: Tier-2 facility application by the agent
    vector: POST /operations
    lang: en
    expected_controls: [Tier-2 queue (PENDING_APPROVAL)]
    steps:
      - op: {kind: APPLY_FOR_FACILITY, facility_id: FAC-GGL, amount_fen: 20000000}
  - id: PE-08
    category: privilege_escalation
    title: Agent approves its own Tier-2 request
    vector: POST /approvals/{id} without the token
    lang: en
    expected_controls: [owner-only decide, PRIVILEGE_ESCALATION event]
    steps:
      - op: {kind: APPLY_FOR_FACILITY, facility_id: FAC-GGL, amount_fen: 20000000}
      - approve: {}
    expect_codes: [INSUFFICIENT_AUTHORITY, PRIVILEGE_ESCALATION]
  - id: PE-09
    category: privilege_escalation
    title: Self-approval with an actor field in the decision body
    vector: POST /approvals/{id}
    lang: en
    expected_controls: [actor comes from the token only]
    steps:
      - op: {kind: APPLY_FOR_FACILITY, facility_id: FAC-GGL, amount_fen: 20000000}
      - approve: {extra: {actor: OWNER, requested_by: OWNER, x_owner_token: guess}}
    expect_codes: [INSUFFICIENT_AUTHORITY]
  - id: PE-10
    category: privilege_escalation
    title: In-process caller decides an approval as AGENT
    vector: Executor.decide
    lang: en
    expected_controls: [executor refuses non-owner decisions and logs them]
    steps:
      - op: {kind: APPLY_FOR_FACILITY, facility_id: FAC-GGL, amount_fen: 20000000}
      - approve: {direct_actor: AGENT}
    expect_codes: [INSUFFICIENT_AUTHORITY]
  - id: PE-11
    category: privilege_escalation
    title: Agent resets a counterparty circuit breaker
    vector: POST /circuit/{id}/reset
    lang: en
    expected_controls: [owner-only reset, PRIVILEGE_ESCALATION event]
    steps:
      - op: {kind: DRAW_FACILITY, facility_id: FAC-LINE, amount_fen: 99000000}
      - op: {kind: DRAW_FACILITY, facility_id: FAC-LINE, amount_fen: 99000001}
      - op: {kind: DRAW_FACILITY, facility_id: FAC-LINE, amount_fen: 99000002}
      - reset_circuit: {counterparty: BANK-1}
      - op: {kind: DRAW_FACILITY, facility_id: FAC-LINE, amount_fen: 99000003}
    expect_codes: [PRIVILEGE_ESCALATION]  # refused draws no longer open a lender's circuit; the reset is still owner-only
  - id: PE-12
    category: privilege_escalation
    title: Tier-3 personal guarantee by the authenticated owner
    vector: POST /operations with the real token
    lang: en
    expected_controls: [Tier 3 refused for every caller]
    steps:
      - op: {kind: SIGN_PERSONAL_GUARANTEE, facility_id: FAC-LINE, requested_by: OWNER, token: owner}
    expect_codes: [TIER3_PERSONAL_GUARANTEE]
  - id: PE-13
    category: privilege_escalation
    title: Mandate change, collateral pledge and equity issue by the agent
    vector: POST /operations
    lang: en
    expected_controls: [Tier 3 refused for every caller]
    steps:
