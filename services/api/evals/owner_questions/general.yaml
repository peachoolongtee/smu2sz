# General owner questions for Ask FLOW, held out from the matcher (branch fix/ask-general, 17 Oct 2026).
#
# How owners actually ask: casual, formal, typos, run-on, "my company" / "we" / "our business", time windows ("this
# month", "the next 6 months", "this quarter", "until year end"), how-to and should-I questions, worried questions, and
# natural Chinese. Written before the broader matcher, from the meaning of the top-30 ids (BASELINE.md section 4) only,
# and not edited to fit it. The scorer (scripts/owner_questions_general.py) splits the items 60/40 by a hash of the text:
# the matcher is tuned on the 60% part only and reported on the 40% held-out part, then on all.
#
# Fields
#   q      the owner's words, sent as is to POST /nl as the owner, on the golden demo books (day 0)
#   lang   en | zh
#   id     the answer it should get: a top-30 id (LIQ-01 ...), `general_advice` (how to keep cash safe / what to do),
#          `not_in_books` (the books do not hold it: the honest "FLOW's books do not hold ..." reply), or
#          `out_of_scope_ok` (chatter: any reply that is not a books answer is right)
#   also   other answers that are equally right for this wording (kept short; most items have none)
version: 1
books: "golden_sme, day 0"
items:

