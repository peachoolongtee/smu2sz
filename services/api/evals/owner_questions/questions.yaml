# Owner question bank for Ask FLOW (POST /nl): what an owner, CEO or CFO of a 20-100 person supplier asks, in English
# and Chinese, with the data in FLOW's books that answers each one (or `not_in_books: true`) and, for the golden demo
# books on day 0 (`golden_sme`, Runtime.reset()), the figure the answer must carry.
#
# Every expected figure was read from an existing read route on day 0 (GET /state, /trajectory, /home, /mandate,
# /receivables, /worklist, /alerts, /reconciliation, /ledger, /activity, /approvals/queue, POST /router/plan,
# POST /capex/evaluate, GET /whatif/presets) or from fixtures/golden/golden_values.json. A figure marked
# `derived:` is one line of arithmetic on route values (the formula is given); nothing else is computed here. A blank
# `figures` list means no existing route gives the number; the answer is then judged by `expect_re` or by hand.
#
# Fields
#   id, category, text_en, text_zh, para_en, para_zh (paraphrases: how people phrase the same question differently)
#   kind        figure | yes_no | list | refusal (refusal = the books cannot answer; the right reply says so and offers
#               the nearest thing FLOW can do)
#   data        where the answer lives (store / model field / module function); see BASELINE.md section 1
#   routes      the read routes that already carry the answer
#   ok_intents  the /nl intents whose reply is on topic for this question (used by the baseline scorer)
#   expected    answer (yes/no for yes_no), figures (tokens the reply must carry), expect_re (a direct answer when no figure
#               applies), direct_re (for a yes/no: the explicit yes/no sentence when it is not the reply's first line),
#               wrong_re (a reply that is misleading for this question), note
#   value       1-3: how much an owner (and the demo) gains from a direct answer
#
# Figure tokens (scripts/owner_questions_baseline.py matches them in the reply, en and zh renderings):
#   "¥405000" money in yuan (the sign is ignored: "−¥105,000.00" matches "¥105000"); "d12" a number of days or day 12;
#   "m31" a month count or month 31; "6.40%" a percentage; "2.00x" a ratio; "t:Foshan|佛山" literal alternatives.
version: 1
books: "golden_sme, day 0 (Runtime.reset(); POST /demo/reset?scenario=golden_sme also confirms the demo documents)"
questions:

# ---------------------------------------------------------------- liquidity and cash
- id: LIQ-01
  category: liquidity
  text_en: "Are we safe?"
  text_zh: "我们安全吗？"
  para_en: ["Are we ok for cash?", "Is our cash position safe?"]
  para_zh: ["现金够不够？", "公司资金安全吗？"]
  kind: yes_no
  data: ["trajectory.first_breach_day", "trajectory.min_cash_fen", "mandate.min_cash_fen", "funding.plan"]
  routes: ["GET /home", "GET /trajectory"]
  ok_intents: [SHOW_STATUS, SHOW_ALERTS]
  expected:
    answer: "no"
    figures: ["d12", "¥405000"]
    note: "Not without funding: cash falls to ¥60,000 in 12 days, ¥240,000 under the ¥300,000 reserve; worst −¥105,000 on day 30 (¥405,000 short); FLOW's ¥3,113.93 plan covers it."
  value: 3

