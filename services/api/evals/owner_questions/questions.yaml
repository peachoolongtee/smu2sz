  text_en: "What would break our covenants?"
  text_zh: "什么情况会让我们违反契约？"
  para_en: ["How much more debt service can we carry?"]
  para_zh: ["还本付息最多能到多少？"]
  kind: figure
  data: ["FinancialState.monthly_ebitda_fen", "Mandate.min_dscr_bp", "Mandate.max_leverage_bp"]
  routes: ["GET /state", "GET /mandate"]
  ok_intents: [SHOW_RATIOS, EXPLAIN, WHAT_IF]
  expected:
    figures: ["¥72000", "¥2700000"]
    note: "derived: monthly debt service above ¥90,000 / 1.25 = ¥72,000 breaks DSCR; total debt above 2.5 × 12 × ¥90,000 = ¥2,700,000 breaks leverage."
  value: 3

- id: COV-06
  category: covenants
  text_en: "How much more can we borrow before we break the leverage covenant?"
  text_zh: "在不违反杠杆契约的前提下还能再借多少？"
  para_en: ["What's our leverage headroom in yuan?"]
  para_zh: ["杠杆余量换成金额是多少？"]
  kind: figure
  data: ["FinancialState.monthly_ebitda_fen", "trajectory.months.total_debt", "Mandate.max_leverage_bp"]
  routes: ["GET /trajectory"]
  ok_intents: [SHOW_RATIOS, WHAT_IF]
  expected:
    figures: ["¥1245000"]
    note: "derived: 2.5 × 12 × ¥90,000 − ¥1,455,000 (month-1 debt) = ¥1,245,000; the DSCR covenant may bind first if the new debt amortises."
  value: 2

- id: COV-07
  category: covenants
  text_en: "Would FLOW's funding plan break a covenant?"
  text_zh: "FLOW的融资方案会违反契约吗？"
  para_en: ["Does the plan breach any covenant?"]
  para_zh: ["这个方案会不会违反契约？"]
  kind: yes_no
  data: ["FundingPlan.violations", "covenants.pro_forma"]
  routes: ["POST /router/plan (violations empty)"]
  ok_intents: [SHOW_RATIOS, COMPARE_FINANCING, EXPLAIN, WHAT_IF]
  expected:
    answer: "no"
    note: "No: the plan has no violations; leverage rises to 1.49x in month 1 against 2.50x, and the line is repaid on day 32."
  value: 2

- id: COV-08
  category: covenants
  text_en: "Is the credit line clean-down at risk?"
  text_zh: "授信清零要求有风险吗？"
  para_en: ["Could we miss the clean-down?"]
  para_zh: ["清零会不会做不到？"]
  kind: yes_no
  data: ["alerts(CLEAN_DOWN_AT_RISK)"]
  routes: ["GET /alerts"]
  ok_intents: [SHOW_RATIOS, SHOW_ALERTS]
  expected:
    direct_re: "Clean-down of the credit line: no alert raised|信用额度的清零要求：没有预警"
    answer: "no"
    expect_re: "(?i)no alert|clean-down[^.\\n]{0,40}(no alert|not at risk)|清零[^。\\n]{0,20}没有预警"
  value: 1

- id: COV-09
  category: covenants
  text_en: "What is our EBITDA?"
  text_zh: "我们的EBITDA是多少？"
  para_en: ["What's our monthly operating profit?"]
  para_zh: ["每月息税折旧前利润是多少？"]
  kind: figure
  data: ["FinancialState.monthly_ebitda_fen"]
  routes: ["GET /state"]
  ok_intents: [SHOW_RATIOS, SHOW_STATUS]
  expected:
    figures: ["¥90000"]
  value: 2

# ---------------------------------------------------------------- capex
- id: CAP-01
  category: capex
  text_en: "Can we afford a new machine?"
  text_zh: "我们买得起一台新设备吗？"
  para_en: ["Can we afford the die-cutting line?"]
  para_zh: ["这台模切线我们买得起吗？"]
  kind: yes_no
  data: ["capex.evaluate_capex", "CapexRequest defaults"]
  routes: ["POST /capex/evaluate"]
  ok_intents: [CAPEX]
  expected:
    direct_re: "Finance with the 48-month lease|建议采用48 个月租赁|^Only financed\\.|^只能融资购买。"
    answer: "yes"
    figures: ["¥600000"]
    note: "Only financed: cash plus the line leaves ¥250,000 above the reserve for a ¥600,000 price; the 48-month lease (¥14,423.49 a month) passes every limit."
  value: 3

- id: CAP-02
  category: capex
  text_en: "What's the best way to finance the ¥600k machine?"
  text_zh: "60万的设备怎么融资最好？"
