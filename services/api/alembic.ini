# Alembic config for the TermsLedger API. The database comes from DATABASE_URL
# (default sqlite:///./termsledger.db, see app/config.py). Run from services/api:
#   DATABASE_URL=sqlite:///./termsledger.db uv run alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Left empty on purpose: migrations/env.py reads DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
