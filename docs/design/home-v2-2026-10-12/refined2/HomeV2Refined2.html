<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home V2 refined 2</title>
<!-- Home V2 visual reference, second pass (the owner's second review, 08_second_review_and_lead_decisions.md, 13 Oct 2026).
     Every money, date and status word below was read from the running API (localhost:8188, Demo day 0, offers EX01_PACKAGE,
     EX02_EARLY_1_5, EX03_AS_USUAL evaluated): GET /home, /worklist, /customers, /offers/{id}, /offers/{id}/picture,
     /offers/{id}/exposure and the evaluate response, lang=en. Labels with no money or date inside are dictionary words.
     States: ?state=default | deal | compare | phone.  &shot=1 hides the reviewer's switch.  &sheet=1 opens the phone worklist sheet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* tokens from apps/web/app/globals.css (@theme static); no new hue */
  --font-sans:"Lato","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;
  --font-display:"Plus Jakarta Sans","Lato","Inter",ui-sans-serif,system-ui,sans-serif;
  --color-canvas:#f5f7fb; --color-surface:#ffffff; --color-subtle:#eff3f8; --color-line:#e6e9ef; --color-line-strong:#d3d9e2; --color-line-ui:#768399; --color-track:#eef1f5;
  --color-ink:#24324a; --color-ink-2:#4d5767; --color-ink-3:#5a6577;
  --color-brand-50:#e6f1ff; --color-brand-100:#d0e5ff; --color-brand-600:#0368e9; --color-brand-700:#0048a5;
  --color-ok-fg:#0a6b5f; --color-ok-solid:#12907f;
  --color-warn-fg:#82490a; --color-warn-solid:#b7791f;
  --color-bad-fg:#a3241a; --color-bad-bg:#fdecea; --color-bad-solid:#d2362a;
  --color-info-fg:#0048a5; --color-info-line:#bcd8fd; --color-info-solid:#0472ff;
  --color-chart-base:#0472ff; --color-chart-reserve:#a3241a; --color-chart-danger:#fdecea; --color-chart-grid:#e6e9ef; --color-chart-axis:#5a6577;
  --shadow-pop:0 4px 8px rgb(36 50 74 / .06),0 18px 36px -12px rgb(36 50 74 / .24);
  --shadow-up:0 -4px 12px rgb(36 50 74 / .08);
  --radius-pill:9999px; --radius-decision:16px; --radius-card:14px; --radius-tile:10px; --radius-control:8px;
  --ease-ui:cubic-bezier(.2,0,0,1); --ease-select:cubic-bezier(.25,1,.5,1);
  --dur-fast:140ms; --dur:220ms; --dur-scenario:300ms;
  --nav-w:200px; --pad:32px; --section:32px;
}
*{box-sizing:border-box}
html{color-scheme:light;background:var(--color-surface);color:var(--color-ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{margin:0;font-size:15px;line-height:1.5;background:var(--color-surface)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--color-brand-600);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.arrow{font-family:var(--font-display);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.bad{background:var(--color-bad-solid)} .dot.warn{background:var(--color-warn-solid)} .dot.ok{background:var(--color-ok-solid)}

/* ---------- type roles: Label → Number → Interpretation → Action ---------- */
.lbl{font-size:13px;line-height:18px;font-weight:700;color:var(--color-ink-3);margin:0}
.eyebrow{font-size:13px;line-height:18px;font-weight:700;color:var(--color-brand-700);margin:0 0 6px}
.h-section{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:24px;letter-spacing:-.01em;margin:0}
.interp{font-size:14px;line-height:20px;color:var(--color-ink-2);margin:0}
.meta{font-size:13px;line-height:18px;color:var(--color-ink-3)}

/* ---------- ActionGroup: one filled primary per page; every decision level keeps a real button ---------- */
.ag{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{height:40px;padding:0 16px;border-radius:var(--radius-control);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;line-height:1;white-space:nowrap;border:1px solid transparent;transition:background var(--dur-fast) var(--ease-ui),border-color var(--dur-fast) var(--ease-ui),color var(--dur-fast) var(--ease-ui)}
.btn.filled{background:var(--color-brand-600);color:#fff;font-weight:900}
.btn.filled:hover{background:var(--color-brand-700)}
.btn.outline{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-ink)}
.btn.outline:hover{border-color:var(--color-line-ui);background:var(--color-canvas)}
.btn.outline[aria-expanded=true]{background:var(--color-subtle);border-color:var(--color-line-ui)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn .chev{width:14px;height:14px;transition:transform var(--dur) var(--ease-ui)}
.btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.link{color:var(--color-brand-700);font-weight:700;white-space:nowrap;font-size:14px}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- SegmentedTabs compact: radius 10, 32 px, thin border, white selected, no shadow ---------- */
.seg{position:relative;display:inline-flex;height:32px;padding:2px;border:1px solid var(--color-line-strong);background:var(--color-track);border-radius:10px;flex:none}
.seg .pill{position:absolute;top:2px;bottom:2px;left:0;border-radius:8px;background:var(--color-surface);border:1px solid var(--color-line-strong);transition:transform var(--dur-fast) var(--ease-select),width var(--dur-fast) var(--ease-select)}
.seg button{position:relative;z-index:1;height:26px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--color-ink-2);white-space:nowrap}
.seg button:hover{color:var(--color-ink)}
.seg button[aria-selected=true]{font-weight:700;color:var(--color-ink)}
.seg.quiet button{color:var(--color-ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100dvh}
.nav{background:var(--color-canvas);padding:22px 14px 20px}
.nav-in{position:sticky;top:22px;display:flex;flex-direction:column;gap:2px;height:calc(100dvh - 42px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand-mark{width:28px;height:28px;border-radius:var(--radius-control);background:var(--color-brand-600);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--radius-control);font-size:14px;font-weight:700;color:var(--color-ink-2);white-space:nowrap}
.nav a:hover{color:var(--color-ink);background:var(--color-subtle)}
.nav a[aria-current]{background:var(--color-surface);color:var(--color-ink);box-shadow:0 0 0 1px var(--color-line)}
.nav a[aria-current] svg{color:var(--color-brand-600)}
.nav svg{width:16px;height:16px;flex:none}
.nav-foot{margin-top:auto;padding:0 8px;display:grid;gap:14px}
.nav-note{font-size:13px;line-height:18px;color:var(--color-ink-3);margin:0}
.ask{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius-pill);border:1px solid var(--color-line-strong);background:var(--color-surface);font-weight:700;font-size:14px;width:max-content}
.ask svg{width:16px;height:16px;color:var(--color-brand-600)}

.main{padding:24px var(--pad) 56px;min-width:0}

/* ---------- header: context left, controls right ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px}
.page{font-size:13px;line-height:18px;font-weight:700;color:var(--color-ink-3);margin:0 0 6px}
.headline{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0;display:flex;align-items:baseline;gap:12px}
.headline .dot{transform:translateY(-5px)}
.top-right{display:flex;align-items:center;gap:12px;flex:none;padding-top:2px}
.fresh{font-size:13px;color:var(--color-ink-3);white-space:nowrap}
.account{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 4px;border-radius:var(--radius-control);font-size:14px;font-weight:700;color:var(--color-ink)}
.account:hover{background:var(--color-subtle)}
.account .av{width:26px;height:26px;border-radius:50%;background:var(--color-brand-50);color:var(--color-brand-700);display:grid;place-items:center}
.account .av svg{width:15px;height:15px}
.account .chev{width:14px;height:14px;color:var(--color-ink-3)}
.vr{width:1px;height:20px;background:var(--color-line)}

.work{display:grid;grid-template-columns:minmax(0,7fr) minmax(340px,3fr);gap:0 40px;align-items:start}
.col{min-width:0}
.section{padding-top:var(--section);margin-top:var(--section);border-top:1px solid var(--color-line)}

/* ---------- MetricStrip ---------- */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--color-line);border-bottom:1px solid var(--color-line)}
.metric{padding:18px 22px 20px;position:relative;min-width:0}
.metric+.metric{border-left:1px solid var(--color-line)}
.metric:first-child{padding-left:0}
.metric-head{display:flex;align-items:center;gap:4px}
.info{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--color-ink-3)}
.info:hover,.info[aria-expanded=true]{color:var(--color-brand-600);background:var(--color-brand-50)}
.info svg{width:14px;height:14px}
.value{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 6px;white-space:nowrap}
.value.bad{color:var(--color-bad-fg)} .value.plan{color:var(--color-brand-600)}
.sub2{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--color-ink-3)}
.sub2 b{font-family:var(--font-display);font-weight:700;color:var(--color-ink-2);font-variant-numeric:tabular-nums}
.buffer{position:relative;height:14px;margin:10px 0 0;max-width:220px}
.buffer .track{position:absolute;left:0;right:0;top:6px;height:2px;border-radius:2px;background:var(--color-line)}
.buffer .fill{position:absolute;left:0;top:6px;height:2px;border-radius:2px;background:var(--color-ink-3)}
.buffer .min{position:absolute;top:1px;width:2px;height:12px;background:var(--color-warn-solid);border-radius:1px}
.buffer .cash{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--color-brand-600);box-shadow:0 0 0 2px var(--color-surface)}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.sw svg{width:14px;height:14px;flex:none}
.sw.ok{color:var(--color-ok-fg)} .sw.ok svg{color:var(--color-ok-solid)}
.sw.bad{color:var(--color-bad-fg)} .sw.bad svg{color:var(--color-bad-solid)}
.sw.warn{color:var(--color-warn-fg)} .sw.warn svg{color:var(--color-warn-solid)}
.sw.info{color:var(--color-info-fg)} .sw.info svg{color:var(--color-info-solid)}
.pop{position:absolute;z-index:20;top:44px;left:12px;width:300px;background:var(--color-surface);border-radius:var(--radius-card);box-shadow:var(--shadow-pop);padding:14px 16px;font-size:14px;line-height:20px;color:var(--color-ink-2);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity var(--dur) var(--ease-ui),transform var(--dur) var(--ease-ui)}
.metric:first-child .pop{left:-4px}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop h4{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--color-ink)}
.pop ul{margin:0;padding-left:18px}

/* ---------- DecisionHighlight (compact) ---------- */
.rec{margin-top:24px;background:var(--color-canvas);border-radius:var(--radius-card);padding:20px 24px 22px}
.rec-title{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.25;letter-spacing:-.02em;margin:0}
.rec .interp{margin-top:6px}
.facts3{display:grid;grid-template-columns:auto minmax(0,1.6fr) auto;gap:0;margin:16px 0 18px;padding:12px 0 0;border-top:1px solid var(--color-line-strong)}
.facts3 div{min-width:0;padding-right:24px}
.facts3 div+div{padding-left:24px;border-left:1px solid var(--color-line-strong)}
.facts3 dt{font-size:13px;line-height:18px;color:var(--color-ink-3);margin:0 0 2px}
.facts3 dd{margin:0;font-size:14px;line-height:20px;font-weight:700;color:var(--color-ink)}
.facts3 dd.num{font-size:15px}

/* the business-health band (deal focus): keeps a real, outlined button */
.health{display:none;margin-top:20px;align-items:center;gap:16px;padding:12px 12px 12px 16px;background:var(--color-canvas);border-radius:12px}
.health .h-text{min-width:0;flex:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px;line-height:20px;color:var(--color-ink-2)}
.health .h-text b{color:var(--color-ink);font-weight:700}
.health .h-text .dot{transform:translateY(-1px)}
.health .h-cost{font-size:13px;color:var(--color-ink-3);white-space:nowrap}
.health .h-cost .num{color:var(--color-ink-2);font-weight:700}

/* ---------- Decision preview (deal focus) ---------- */
.deal{display:none}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-ink-3);margin:0 0 14px}
.crumbs button{color:var(--color-brand-700);font-weight:700}
.dp-title{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:4px 0 0}
.who{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 0;font-size:14px;color:var(--color-ink-2)}
.ask-line{margin:14px 0 0;font-size:15px;line-height:22px;color:var(--color-ink);max-width:68ch}
.ask-line .lbl{display:block;margin-bottom:2px}
.dp-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:8px 0 18px;padding:0;border-top:1px solid var(--color-line);border-bottom:1px solid var(--color-line)}
.dp-facts>div{padding:14px 20px 14px 0;min-width:0}
.dp-facts>div+div{padding-left:20px;border-left:1px solid var(--color-line)}
.dp-facts dt{display:flex;align-items:center;gap:10px;font-size:13px;line-height:18px;font-weight:700;color:var(--color-ink-3)}
.dp-facts dd{margin:8px 0 0}
.dp-facts .big{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-.01em}
.dp-facts .big.bad{color:var(--color-bad-fg)}
.dp-facts .reason{display:block;font-size:13px;line-height:18px;color:var(--color-ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--color-line-strong)}
.dp-facts .scope{display:block;font-size:13px;line-height:18px;color:var(--color-ink-2);margin-top:2px}

.conseq{margin-top:28px;padding-top:24px;border-top:1px solid var(--color-line)}
.assume{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:14px}
.assume .lbl{color:var(--color-ink-2)}
.assume-note{margin:6px 0 0;font-size:13px;line-height:18px;color:var(--color-ink-3)}
.cq-rows{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--color-line);transition:opacity var(--dur-scenario) var(--ease-ui)}
.cq-rows li{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,.9fr) minmax(0,1.6fr);align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--color-line)}
.cq-rows .path{font-size:14px;font-weight:700;color:var(--color-ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cq-rows .path .tag{font-size:13px;font-weight:700}
.cq-rows .v{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.cq-rows .v small{font-family:var(--font-sans);font-weight:400;font-size:13px;color:var(--color-ink-3);margin-left:6px}
.cq-rows .v.bad{color:var(--color-bad-fg)}
.fading{opacity:.15}
.after-cq{margin-top:14px}

/* ---------- ComparisonTable ---------- */
.cmp{display:none;margin-top:14px}
.cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;transition:opacity var(--dur-scenario) var(--ease-ui)}
.ctable{width:100%;min-width:600px;border-collapse:separate;border-spacing:0;font-size:14px;line-height:20px;table-layout:fixed}
.ctable col.rh{width:150px}
.ctable th,.ctable td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--color-line)}
.ctable thead th{padding:10px 14px 10px;font-weight:700;font-size:14px;color:var(--color-ink);border-bottom:1px solid var(--color-line-strong);vertical-align:bottom}
.ctable thead th .t{display:block;font-size:13px;font-weight:700;margin-top:2px}
.ctable tbody th{font-size:13px;font-weight:700;color:var(--color-ink-3);padding-left:0;position:sticky;left:0;background:var(--color-surface);z-index:1}
.ctable thead th:first-child{padding-left:0;position:sticky;left:0;background:var(--color-surface);z-index:1}
.ctable .rec-col{background:color-mix(in srgb,var(--color-brand-50) 45%,transparent);box-shadow:inset 1px 0 0 var(--color-info-line),inset -1px 0 0 var(--color-info-line)}
.ctable thead .rec-col{background:var(--color-brand-50);box-shadow:inset 0 2px 0 var(--color-brand-600),inset 1px 0 0 var(--color-info-line),inset -1px 0 0 var(--color-info-line);border-radius:8px 8px 0 0}
.ctable tbody tr:last-child .rec-col{box-shadow:inset 1px 0 0 var(--color-info-line),inset -1px 0 0 var(--color-info-line),inset 0 -1px 0 var(--color-info-line)}
.cv{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;line-height:22px;color:var(--color-ink);display:block}
.cv.bad{color:var(--color-bad-fg)}
.cs{display:block;font-size:13px;line-height:18px;color:var(--color-ink-3)}
.cs.scope{color:var(--color-ink-2)}
.pair{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.comp{margin:6px 0 0;padding:6px 0 0;border-top:1px dashed var(--color-line-strong);font-size:13px;line-height:18px;color:var(--color-ink-2)}
.comp div{display:flex;justify-content:space-between;gap:8px}
.comp span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.cell-changed{animation:none}
.cstack{display:none}
.why{margin-top:22px}
.why ul{list-style:none;margin:8px 0 0;padding:0}
.why li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:6px 0;font-size:14px;line-height:20px;color:var(--color-ink-2)}
.why .ev-row{display:flex;gap:8px;align-items:flex-start}
.ev-g{width:14px;height:14px;flex:none;margin-top:3px}.ev-g.ok{color:var(--color-ok-solid)}.ev-g.warn{color:var(--color-warn-solid)}.ev-g.bad{color:var(--color-bad-solid)}
.why li b{color:var(--color-ink);font-weight:700}
.why-links{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px}
details.fold{margin-top:20px;border-top:1px solid var(--color-line);border-bottom:1px solid var(--color-line)}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;height:48px;font-weight:700;font-size:14px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary svg{width:16px;height:16px;color:var(--color-ink-3);transition:transform var(--dur) var(--ease-ui)}
details.fold[open] summary svg{transform:rotate(180deg)}
.fold-body{padding:0 0 14px;display:grid;gap:12px}
.fold-body dl{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:14px;line-height:20px;color:var(--color-ink-2)}
.fold-body dt{font-size:13px;font-weight:700;color:var(--color-ink-3)}
.fold-body dd{margin:0}

/* ---------- CashPreview ---------- */
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.chart-scope{margin:4px 0 0;font-size:14px;line-height:20px;color:var(--color-ink-2)}
.chart-scope b{color:var(--color-ink);font-weight:700}
.legend{display:flex;gap:8px 20px;flex-wrap:wrap;margin:12px 0 0;font-size:13px;color:var(--color-ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:2.25px solid var(--color-chart-base)}
.legend i.below{border-top-color:var(--color-bad-solid)}
.legend i.plan{border-top:2px dashed var(--color-ink-3)}
.legend i.opt{border-top:2px dashed var(--color-brand-600)}

.utabs{position:relative;display:flex;gap:22px;margin-top:18px;border-bottom:1px solid var(--color-line)}

.search{display:flex;align-items:center;gap:8px;height:38px;margin:10px 0 6px;padding:0 2px;border-bottom:1px solid var(--color-line);color:var(--color-ink-3)}

.search input::placeholder{color:var(--color-ink-3)}
.rows{list-style:none;margin:0;padding:0}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:12px 12px 12px 14px;margin:0 -12px 0 -14px;border-radius:var(--radius-tile);cursor:pointer;transition:background var(--dur-fast) var(--ease-ui)}
.row+.row::before{content:"";position:absolute;left:14px;right:12px;top:0;border-top:1px solid var(--color-line)}
.row:hover{background:var(--color-canvas)}

.row:focus-visible{outline:2px solid var(--color-brand-600);outline-offset:0;border-radius:var(--radius-tile)}
.row .subj{font-size:15px;font-weight:700;line-height:21px;color:var(--color-ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .qual{grid-column:1;font-size:13px;line-height:18px;color:var(--color-ink-3);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-1px}
.row .st{font-size:13px;line-height:19px;color:var(--color-ink-2);grid-column:1}
.row .cq{font-size:13px;line-height:19px;color:var(--color-ink-3);grid-column:1}
.row .sev{grid-column:2;grid-row:1;align-self:center}
.empty{padding:32px 0 24px}
.empty h3{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0 0 4px}
.empty p{margin:0;font-size:14px;color:var(--color-ink-3)}
.inbox-foot{margin-top:14px}

  .health .ag .btn{flex:none;height:36px}
  .dp-title{font-size:21px}
  .dp-facts{grid-template-columns:1fr}

  .cq-rows li{grid-template-columns:1fr auto;gap:2px 12px}
  .cq-rows li .i{grid-column:1 / -1}
  .assume .seg{width:100%}

  /* the comparison stacks: one block per response, the recommended one first-tinted */
  .cmp-scroll{display:none}

  .inspect{grid-template-columns:1fr 1fr}

  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;position:sticky;top:0;background:var(--color-surface);z-index:2}
  .sheet-head::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--color-line-strong)}

  .inbox-head{display:none}
  .alert{margin-top:0}
  .scrim{display:block;position:fixed;inset:0;z-index:39;background:rgb(36 50 74 / .32);opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease-ui)}
  body.sheet-open .scrim{opacity:1;pointer-events:auto}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--color-surface);border-top:1px solid var(--color-line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  .tabbar a{display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--color-ink-3)}

  .tabbar svg{width:20px;height:20px}
  .rev{bottom:150px}
  .links{gap:10px 20px}
}

  let g = `<defs><clipPath id="cl-above"><rect x="0" y="-20" width="${Wpx}" height="${fy + 20}"/></clipPath><clipPath id="cl-below"><rect x="0" y="${fy}" width="${Wpx}" height="${Hh}"/></clipPath></defs>`;
  g += `<rect x="${mg.l}" y="${fy}" width="${right - mg.l}" height="${y(ax.min) - fy}" fill="var(--color-chart-danger)" opacity=".5"/>`;
  const keep = ax.ticks.filter(([v], i) => v === 0 || i === ax.ticks.length - 1 || (ax.ticks.length <= 5 ? true : i % 2 === 0));
  for (const [v, l] of keep) { g += `<line x1="${mg.l}" x2="${right}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "var(--color-line-strong)" : "var(--color-chart-grid)"}"/><text x="${mg.l - 10}" y="${y(v) + 4}" text-anchor="end">${esc(l)}</text>`; }
  g += `<line x1="${mg.l}" x2="${right}" y1="${fy}" y2="${fy}" stroke="var(--color-chart-reserve)" stroke-width="1.25"/>`;
  for (const d of xt) g += `<text x="${x(d)}" y="${Hh - 6}" text-anchor="${d === 0 ? "start" : d === W ? "end" : "middle"}">${d === 0 ? T.today : T.inDays(d)}</text>`;
  const [base, other] = m.lines;
  g += other.kind === "plan"
    ? `<path d="${stepPath(other.s, x, y, W)}" fill="none" stroke="var(--color-ink-3)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".85"/>`
    : `<path d="${stepPath(other.s, x, y, W)}" fill="none" stroke="var(--color-brand-600)" stroke-width="1.75" stroke-dasharray="6 4"/>`;
  const bp = stepPath(base.s, x, y, W);
  g += `<path d="${bp}" fill="none" stroke="var(--color-chart-base)" stroke-width="2.25" stroke-linejoin="miter" clip-path="url(#cl-above)"/>`;
  g += `<path d="${bp}" fill="none" stroke="var(--color-bad-solid)" stroke-width="2.75" stroke-linejoin="miter" clip-path="url(#cl-below)"/>`;
  if (selDay === null || selDay > W) selDay = m.lowest <= W ? m.lowest : 0;
  const lo = m.lowest;
  if (lo <= W) g += `<circle cx="${x(lo)}" cy="${y(valueAt(base.s, lo))}" r="5" fill="var(--color-surface)" stroke="var(--color-bad-solid)" stroke-width="2"/>`;
  const sx = x(selDay), sy = y(valueAt(base.s, selDay));
  g += `<line x1="${sx}" x2="${sx}" y1="${mg.t}" y2="${Hh - mg.b}" stroke="var(--color-ink)" stroke-width="1" opacity=".22"/>`;
  g += `<circle cx="${sx}" cy="${sy}" r="5" fill="${valueAt(base.s, selDay) < H.floor ? "var(--color-bad-solid)" : "var(--color-chart-base)"}" stroke="var(--color-surface)" stroke-width="2.5"/>`;
  g += `<circle cx="${sx}" cy="${y(valueAt(other.s, selDay))}" r="3.5" fill="var(--color-surface)" stroke="${other.kind === "plan" ? "var(--color-ink-3)" : "var(--color-brand-600)"}" stroke-width="2"/>`;
  g += `<rect id="hit" x="${mg.l}" y="0" width="${right - mg.l}" height="${Hh}" fill="transparent" style="cursor:crosshair"/>`;
  svg.innerHTML = g;
  renderInspector(m, selDay);
  const days = [...new Set([...base.s, ...other.s].map((q) => q[0]).filter((q) => q <= W))];
  const snap = (cx) => { const r = svg.getBoundingClientRect(); const d = ((cx - r.left - mg.l) / (right - mg.l)) * W; return days.reduce((a, b) => Math.abs(b - d) < Math.abs(a - d) ? b : a); };
  const hit = $("#hit");
  hit.addEventListener("mousemove", (e) => { const d = snap(e.clientX); if (d !== selDay) { selDay = d; drawChart(); } });
  hit.addEventListener("mouseleave", () => { if (selDay !== lo) { selDay = null; drawChart(); } });
}
const winSeg = seg($("#win-tabs"), ["36 days", "60 days", "120 days"], 0, (i) => { windowDays = [36, 60, 120][i]; selDay = null; drawChart(); });
function setWindowFor() { const want = isDeal() ? 120 : 36; if (windowDays !== want) { windowDays = want; $("#win-tabs").querySelectorAll("button")[[36, 60, 120].indexOf(want)].click(); } }
addEventListener("resize", drawChart);

$("#links").innerHTML = H.links.map((l) => `<a class="link" href="#">${esc(l.label)} <span class="arrow" aria-hidden="true">→</span></a>`).join("");

/* ===== WorklistRows ===== */
$("#wl-alert").innerHTML = `<b>${esc(WL.alert.eyebrow)}.</b> ${esc(WL.alert.text)}`;
$("#sheet-n").textContent = WL.counts.needs_you;
const TABS = [["needs", "Needs you", WL.counts.needs_you], ["waiting", "Waiting", WL.counts.waiting], ["customers", "Customers", WL.counts.customers]];
let tab = 0, selected = isDeal() ? D.key : null;
const tabsEl = $("#wl-tabs");
TABS.forEach(([k, l, n], i) => { const b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", i === 0);
  b.innerHTML = `${esc(l)} <span class="n">${n}</span>`; b.addEventListener("click", () => setTab(i)); tabsEl.appendChild(b); });
function placeBar() { const b = tabsEl.querySelectorAll("button")[tab], bar = tabsEl.querySelector(".bar"); if (!b.offsetWidth) return; bar.style.width = b.offsetWidth + "px"; bar.style.transform = `translateX(${b.offsetLeft}px)`; }
function setTab(i) { tab = i; tabsEl.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", j === i)); placeBar(); renderRows(); }
const qual = (key) => { const id = key.replace(/^deal:/, ""); return DATA.differentiators[id]; };
function renderRows() {
  const q = $("#wl-q").value.trim().toLowerCase(), panel = $("#wl-panel"); let html = "";
  if (tab === 0) {
    const rows = WL.needs_you.filter((r) => !q || r.subject_text.toLowerCase().includes(q));
    html = rows.length ? `<ul class="rows" role="listbox" aria-label="Needs you">${rows.map((r) => `
      <li class="row" role="option" tabindex="0" data-key="${r.key}" aria-selected="${r.key === selected}">
        <span class="subj">${esc(r.subject_text)}</span>
        <span class="sev">${r.severity === "CAUTION" ? sw("warn", "alert", "Caution") : r.severity === "CRITICAL" ? sw("bad", "alert", "Critical") : ""}</span>
        ${qual(r.key) ? `<span class="qual">“${esc(qual(r.key))}”</span>` : ""}
        <span class="st">${esc(r.status_text)}</span>
        <span class="cq">${esc(r.consequence_text)}</span>
      </li>`).join("")}</ul>` : `<div class="empty"><h3>All caught up.</h3><p>Nothing needs a decision from you.</p></div>`;
  } else if (tab === 1) html = `<div class="empty"><h3>All caught up.</h3><p>FLOW is not waiting for anyone.</p></div>`;
  else html = `<ul class="rows">${WL.customers.filter((r) => !q || r.name.toLowerCase().includes(q)).map((r) => `
      <li class="row" tabindex="0"><span class="subj">${esc(r.name)}</span><span></span><span class="st">${esc(r.status_text)}</span><span class="cq">${esc(r.detail_text)}</span></li>`).join("")}</ul>`;
  panel.innerHTML = html;
  panel.querySelectorAll(".row[data-key]").forEach((li) => { const go = () => select(li.dataset.key);
    li.addEventListener("click", go); li.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } }); });
}
$("#wl-q").addEventListener("input", renderRows);
function select(key) {
  const toDeal = key === D.key && selected !== key; selected = toDeal ? key : null;
  const fade = [$("#rec"), $("#health"), $("#deal")];
  const apply = () => { STATE = selected ? "deal" : "default"; document.body.dataset.state = STATE; $("#cmp-btn").setAttribute("aria-expanded", "false");
    document.body.classList.remove("sheet-open"); renderRows(); setWindowFor(); selDay = null; drawChart();
    requestAnimationFrame(() => { scenSeg.place(); fade.forEach((f) => f.style.opacity = 1); }); };
  if (reduced) return apply();
  fade.forEach((f) => { f.style.transition = "opacity var(--dur) var(--ease-ui)"; f.style.opacity = 0; }); setTimeout(apply, 180);
}
$("#back").addEventListener("click", () => select(null));

/* the phone sheet */
const sheet = (open) => { document.body.classList.toggle("sheet-open", open); $("#sheet-head").setAttribute("aria-expanded", open); };
$("#sheet-head").addEventListener("click", () => sheet(!document.body.classList.contains("sheet-open")));
$("#scrim").addEventListener("click", () => sheet(false));
if (params.get("sheet")) sheet(true);

renderRows();
if (isDeal()) { windowDays = 120; }
requestAnimationFrame(() => { if (isDeal()) $("#win-tabs").querySelectorAll("button")[2].click(); placeBar(); drawChart(); });
document.fonts && document.fonts.ready.then(() => { placeBar(); drawChart(); });
</script>
</body>
</html>
