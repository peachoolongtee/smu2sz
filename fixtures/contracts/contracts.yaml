# Demo documents for contract ingestion (ADR-0012).
# Synthetic: each was written to match fixtures/scenarios/golden_sme.json, and each says so in its own text.
# `file` is the canonical text the agent reads when the demo picks the fixture; `formats` are generated copies
# (scripts/build_contract_files.py) that exercise the .docx and text-PDF upload path.
# `party_names` are the names a lender agreement's counterparty goes by in the document, which the demo registry ("Main bank",
# "Invoice financing platform") does not carry: the party check (app/contracts/parties.py, REG-2) accepts them for the fixture
# only, as the short names an owner would register. `link_facility_id` is the existing facility the owner links a lender agreement to on confirmation.
contracts:
  - id: FHR_SUPPLY_AGREEMENT
    kind: BUYER_CONTRACT
    counterparty_id: BUYER-1
    title: Supply agreement FHR-2026-07
    file: fhr-2026-07-supply-agreement.md
    formats: [docx, pdf]
  - id: MB_CREDIT_LINE_AGREEMENT
    kind: LENDER_AGREEMENT
    counterparty_id: BANK-1
    title: Credit line agreement MB-CL-2026-031
    file: mb-cl-2026-031-credit-line-agreement.md
    formats: [docx, pdf]
    party_names: ["Pearl River Commercial Bank, Foshan Branch"]
    link_facility_id: FAC-LINE
  - id: GBR_INVOICE_FINANCING_AGREEMENT
    kind: LENDER_AGREEMENT
    counterparty_id: PLATFORM-1
    title: Invoice financing agreement GBR-IF-2026-118
    file: gbr-if-2026-118-invoice-financing-agreement.md
    formats: [docx, pdf]
    party_names: ["Greater Bay Receivables Finance Co., Ltd."]
    link_facility_id: FAC-IF
