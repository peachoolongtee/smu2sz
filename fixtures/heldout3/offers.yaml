# Held-out set 3: independent evaluator, written from spec v2 §6-8, CONTEXT.md, ARCHITECTURE.md and the
# golden state only (no compiler / nl code, no earlier held-out sets). Labels were fixed before the first run.
#
# State facts used: day 0 = 2026-10-01. BUYER-1 (Foshan Home Retail) owes RCV-A, ¥420,000 (42,000,000 fen),
# issued 2026-09-18 on 45-day terms, due day 32 (2026-11-02); it is invoiced ¥420,000 every 30 days.
# BUYER-2 (Dongguan Office Supplies) has no open receivable. Next-quarter order ¥400,000, not firm.
# Break-even early-pay discount 0.88%; max APR 15%; aggregate forward-concession cap ¥5,000 over 365 days,
# terms extension priced at ¥1,871.30 per invoice per +15 days (invoice-financing marginal rate).
#
# Labelling policy (as instructed):
#   ACCEPT            pure early-pay discount on the named whole invoice, strictly below 0.88%, APR <= 15%
#   COUNTER           early pay at or above 0.88% (or APR above 15%)
#   NEEDS_OWNER_APPROVAL any other acceptable package
#   REJECT            forward concessions over the ¥5,000 cap; unevidenced prior-agreement claims; unknown sender
#   NO_VERDICT        conflicting amounts; partial invoice; unbound scope (abstain: true)
#   unlabelled        outcome not asserted (obligations still scored)
#
# `booked` is what the text actually commits the supplier to (claimed prior concessions go in `claims`).
