    expect:
      outcome: REJECT
      codes: [UNEVIDENCED_PRIOR_CONCESSION]
      booked: []
      claims:
        - {type: CLAIMED_PRIOR_CONCESSION, rate_bp: 200, contingency: CLAIMED_UNEVIDENCED}
  - id: H2U01B_ZH_CLAIM_REBATE
