         text: "Hi Ms. Chen,\n\nFinance here at Foshan Home Retail. We have some spare cash this month and can pay your invoice for ¥420,000 (due early Nov) within 2 working days if you give us a 0.8% discount. Pls confirm by reply.\n\nRgds,\nKevin Wu\nAP team"}
    expect:
      outcome: ACCEPT
      booked:
        - {type: IMMEDIATE_DISCOUNT, rate_bp: 80, base_amount_fen: 42000000, receivable_id: RCV-A, contingency: FIRM, duration: ONE_OFF}
  - id: H2A02_WECHAT_ZH_080
