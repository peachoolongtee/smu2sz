# Held-out set 2: buyer messages nobody has tuned against.
#
# Written from the domain only (spec v2 §6–8, CONTEXT.md, fixtures/offers/offers.yaml for the label
# format, fixtures/scenarios/golden_sme.json for the state) BEFORE reading the compiler, the nl lexicon
# or rules, or the first held-out set. Do not edit these labels to match the system's output; a
# label may change only when the policy it encodes changes, with the reason recorded in
# services/api/evals/heldout2_report.md.
#
# Golden state: BUYER-1 (Foshan Home Retail) owes RCV-A ¥420,000 due day 32 (45-day terms) and is
# invoiced ¥420,000 monthly; ~¥400,000 of next-quarter orders expected (not firm). BUYER-2 (Dongguan
# Office Supplies) has no open receivable. Mandate: ¥5,000 aggregate forward-concession cap over 12
# months; 1.5% max immediate discount; 15% max APR. Break-even early-pay discount 0.88%.
#
# Policy the outcomes encode (Tier-2, current):
#   ACCEPT                only a pure early-pay discount on a named invoice, priced below 0.88%;
#   COUNTER               a pure early-pay discount above break-even (within the 1.5% cap);
#   NEEDS_OWNER_APPROVAL  any other acceptable package (rebates, terms changes either way, packages);
#   REJECT                forward concessions over the ¥5,000 cap, or an unevidenced prior-concession claim;
#   NO_VERDICT            conflicting sources, or a must-abstain message (`abstain: true`).
#   unlabelled            outcome not asserted (obligations still labelled); excluded from agreement.
#
# `booked` = the obligations that should be bound after verification (claims are never booked and go
# in `claims`, which only the form baseline uses). Money in fen, rates in bp.
offers:
  # ---------------------------------------------------------------- pure early pay, below break-even
  - id: H2A01_EMAIL_080
    kind: clean
    counterparty_id: BUYER-1
    documents:
