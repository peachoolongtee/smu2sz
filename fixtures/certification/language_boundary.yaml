  - {id: MM-017, group: malformed_model, kind: obligation_for_non_offer, actor: buyer, lang: en,
     invariant: "A model that hallucinates a 90-day terms change on a greeting produces no commitment",
     text: "Thanks, see you at the Canton Fair on Monday.",
