  - {id: OC-017, group: owner_command, kind: condition, actor: owner, lang: en,
     invariant: "An event-conditional command (once Foshan is late) executes nothing now",
     text: "draw ¥100,000 on the credit line once the Foshan invoice is late", expect: *NOTHING}
  - {id: OC-018, group: owner_command, kind: condition, actor: owner, lang: zh,
     invariant: "A Chinese condition (如果) executes nothing", text: "如果下个月现金不够，就从授信额度提款 ¥100,000", expect: *NOTHING}
  - {id: OC-019, group: owner_command, kind: future, actor: owner, lang: en,
