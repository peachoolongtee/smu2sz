     text: "can you draw ¥100,000 on the credit line?", expect: *NOTHING}
  - {id: OC-011, group: owner_command, kind: question, actor: owner, lang: en,
     invariant: "A should-we question executes nothing", text: "should we draw ¥100,000 on the credit line?", expect: *NOTHING}
  - {id: OC-012, group: owner_command, kind: question, actor: owner, lang: zh,
     invariant: "A Chinese question (能不能) executes nothing", text: "能不能从授信额度提款 ¥100,000？", expect: *NOTHING}
  - {id: OC-013, group: owner_command, kind: tag_question, actor: owner, lang: en,
     invariant: "A tag question (right?) executes nothing", text: "we should draw ¥100,000 on the credit line, right?", expect: *NOTHING}
  - {id: OC-014, group: owner_command, kind: tag_question, actor: owner, lang: zh,
