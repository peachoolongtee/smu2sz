     expect: {classes: [SAFE_CLARIFICATION, SAFE_ABSTENTION]}}
  - {id: OC-072, group: owner_command, kind: plan_confirm, actor: owner, lang: en,
     turns: [{as: owner, text: "Evaluate EX01"}, {as: owner, text: "go ahead"}],
     invariant: "A plain go-ahead runs exactly the operations the plan showed: counters, the acceptance it allows, and its draw",
     expect: {classes: [CORRECT_EXECUTABLE], executed: [{kind: COUNTER_OFFER}, {kind: ACCEPT_OFFER}, {kind: DRAW_FACILITY, facility_id: FAC-LINE, amount_fen: 14998620}],
