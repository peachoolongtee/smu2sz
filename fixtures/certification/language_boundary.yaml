  - {id: MM-018, group: malformed_model, kind: wrong_document, actor: buyer, lang: en,
     invariant: "A quote attributed to a document id that was not sent is rejected",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {extraction: {obligations: [{quote: "pay the full ¥420,000 invoice early next week for 0.5% off", doc_id: OTHER-DOC, rate_text: "0.5%"}]}}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-019, group: malformed_model, kind: duplicated_obligation, actor: buyer, lang: en,
     invariant: "The same obligation reported twice is booked once, never double-counted",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {extraction: {obligations: [
       {quote: "pay the full ¥420,000 invoice early next week for 0.5% off", rate_text: "0.5%"},
       {quote: "pay the full ¥420,000 invoice early next week for 0.5% off", rate_text: "0.5%"}]}}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-020, group: malformed_model, kind: markdown_fence, actor: buyer, lang: en,
     invariant: "JSON wrapped in a markdown fence is not valid output: it fails closed to the next backend",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {raw: "```json\n{\"obligations\": [], \"quantities\": [], \"unresolved_references\": [], \"missing_material\": [], \"data_requests\": [], \"authority_claims\": [], \"funding_claims\": []}\n```"},
                       fallback: {raw: "Sure! Here is the JSON: {\"obligations\": []}"}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-021, group: malformed_model, kind: both_malformed, actor: buyer, lang: en,
     invariant: "Primary truncated and fallback with an extra field: both rejected; the chain ends in the rules grammar",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {raw: "{\"obligations\": [{\"type\": "},
                       fallback: {extraction: {obligations: [], merge: {escalate: true}}}}},
