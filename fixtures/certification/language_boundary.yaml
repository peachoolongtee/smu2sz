  - {id: OC-022, group: owner_command, kind: future, actor: owner, lang: zh,
     invariant: "A Chinese future time (下周一) executes nothing today", text: "下周一从授信额度提款 ¥100,000", expect: *NOTHING}
  # ---- foreign currency and unreadable amounts
  - {id: OC-023, group: owner_command, kind: foreign_currency, actor: owner, lang: en,
     invariant: "A dollar amount is never read as RMB", text: "draw $100,000 on the credit line", expect: *NOTHING}
  - {id: OC-024, group: owner_command, kind: foreign_currency, actor: owner, lang: en,
     invariant: "An ISO currency code other than CNY is never read as RMB", text: "draw 100,000 USD on the credit line", expect: *NOTHING}
  - {id: OC-025, group: owner_command, kind: foreign_currency, actor: owner, lang: en,
