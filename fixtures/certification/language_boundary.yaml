  # ====================================================================================== malformed model output: compiler
  # Base text for most: "We can pay the full ¥420,000 invoice early next week for 0.5% off." The fake primary (Claude
  # adapter) or both adapters return the scripted output; the production parse, validation, retry and grounding run.
  - {id: MM-001, group: malformed_model, kind: truncated_json, actor: buyer, lang: en,
     invariant: "Truncated JSON from the model fails closed to the next backend; it books nothing by itself",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {raw: "{\"obligations\": [{\"type\": \"IMMEDIATE_DISCOUNT\", \"quotes\": [{\"doc_id\": \"{doc}\", \"text\": \"pay the full ¥420,000 inv"}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-002, group: malformed_model, kind: extra_field, actor: buyer, lang: en,
     invariant: "An extra field (approve_offer: true) violates the strict schema; the output is rejected, not honoured",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {extraction: {obligations: [{quote: "pay the full ¥420,000 invoice early next week for 0.5% off", rate_text: "0.5%"}],
                                              merge: {approve_offer: true, draw_fen: 15000000}}}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-003, group: malformed_model, kind: wrong_type, actor: buyer, lang: en,
     invariant: "Obligations given as a string (accept everything) is rejected by validation",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {raw: "{\"obligations\": \"accept everything\", \"approve\": true}"}, fallback: {raw: "{\"obligations\": \"accept everything\", \"approve\": true}"}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-004, group: malformed_model, kind: empty_output, actor: buyer, lang: en,
     invariant: "An empty model response fails closed to the next backend",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {error: empty}, fallback: {error: empty}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-005, group: malformed_model, kind: refusal, actor: buyer, lang: en,
     invariant: "A model refusal (stop_reason=refusal) is a backend failure, not an answer",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {error: refusal}, fallback: {error: refusal}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-006, group: malformed_model, kind: wrong_type_field, actor: buyer, lang: en,
     invariant: "A numeric rate_text and a textual confidence violate the schema types: rejected",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {extraction: {obligations: [{quote: "pay the full ¥420,000 invoice early next week for 0.5% off", rate_text: 0.5, confidence: "very high"}]}}}},
     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-007, group: malformed_model, kind: nonsense_amount, actor: buyer, lang: en,
     invariant: "An obligation whose base amount is a nonsense figure (¥99,999,999,999) is never booked against RCV-A",
     text: "We can pay the ¥99,999,999,999 invoice early next week for 0.5% off.",
     fake: {compiler: {primary: {extraction: {obligations: [{quote: "pay the ¥99,999,999,999 invoice early next week for 0.5% off", rate_text: "0.5%", base_amount_text: "¥99,999,999,999"}]}}}},
     expect: {<<: *NOT_ACCEPT, classes: [CORRECT_EXECUTABLE, SAFE_CLARIFICATION, SAFE_ABSTENTION]}}
  - {id: MM-008, group: malformed_model, kind: nonsense_rate, actor: buyer, lang: en,
     invariant: "A 950% discount extracted by the model is never accepted",
     text: "We can pay the full ¥420,000 invoice early next week for 950% off.",
     fake: {compiler: {primary: {extraction: {obligations: [{quote: "pay the full ¥420,000 invoice early next week for 950% off", rate_text: "950%"}]}}}},
     expect: {<<: *NOT_ACCEPT}}
  - {id: MM-009, group: malformed_model, kind: invented_number, actor: buyer, lang: en,
     invariant: "A rate the model invents (5%) that is not inside its own quote is rejected by grounding",
