     invariant: "An approval for tomorrow decides nothing today", text: "approve APR-000001 tomorrow", expect: *NOTHING}
  - {id: OC-051, group: owner_command, kind: approval_two_ids, actor: owner, lang: en, setup: [pending_approval],
