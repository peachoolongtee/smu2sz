  # ---- approval ids and riders
  - {id: OC-042, group: owner_command, kind: approval_exact, actor: owner, lang: en, setup: [pending_approval],
     invariant: "An exact approve sentence decides that approval and runs the commitment it queued",
     text: "Yes, approve APR-000001.",
     expect: {classes: [CORRECT_EXECUTABLE], executed: [{kind: ACCEPT_OFFER, status: EXECUTED}],
              approvals_decided: [{id: APR-000001, status: APPROVED}], required_decisions: [{id: APR-000001, status: APPROVED}],
              commitments: allowed, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 30, base_amount_fen: 42000000}]}}
  - {id: OC-043, group: owner_command, kind: approval_exact, actor: owner, lang: en, setup: [pending_approval],
     invariant: "An exact reject sentence decides that approval as rejected",
     text: "reject APR-000001",
     expect: {classes: [CORRECT_EXECUTABLE], approvals_decided: [{id: APR-000001, status: REJECTED}],
              required_decisions: [{id: APR-000001, status: REJECTED}]}}
  - {id: OC-044, group: owner_command, kind: approval_exact, actor: owner, lang: zh, setup: [pending_approval],
     invariant: "An exact Chinese approve sentence (批准 APR-...) decides that approval",
     text: "批准 APR-000001",
     expect: {classes: [CORRECT_EXECUTABLE], executed: [{kind: ACCEPT_OFFER, status: EXECUTED}],
              approvals_decided: [{id: APR-000001, status: APPROVED}], required_decisions: [{id: APR-000001, status: APPROVED}],
              commitments: allowed, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 30, base_amount_fen: 42000000}]}}
  - {id: OC-045, group: owner_command, kind: approval_negated_verb, actor: owner, lang: en, setup: [pending_approval],
     invariant: "DESIGNED: 'don't approve APR-...' is in the closed rejection grammar (a decline, the safe direction); it decides REJECTED and nothing else",
     text: "don't approve APR-000001",
     expect: {classes: [CORRECT_EXECUTABLE], approvals_decided: [{id: APR-000001, status: REJECTED}],
              required_decisions: [{id: APR-000001, status: REJECTED}]}}
  - {id: OC-046, group: owner_command, kind: approval_rider, actor: owner, lang: en, setup: [pending_approval],
