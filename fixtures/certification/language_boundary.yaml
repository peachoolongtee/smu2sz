  - {id: OC-058, group: owner_command, kind: approval_all, actor: owner, lang: en, setup: [pending_approval],
     invariant: "Approve-everything decides nothing", text: "approve everything pending", expect: *NOTHING}
  # ---- read-only and vague
  - {id: OC-059, group: owner_command, kind: read_only, actor: owner, lang: en,
