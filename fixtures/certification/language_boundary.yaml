  - {id: OC-062, group: owner_command, kind: read_only, actor: owner, lang: zh,
     invariant: "A Chinese ratio question is read-only", text: "我们现在的DSCR怎么样",
     expect: {classes: [CORRECT_READ_ONLY, SAFE_CLARIFICATION], intents: [SHOW_RATIOS, SHOW_STATUS]}}
  - {id: OC-063, group: owner_command, kind: read_only, actor: owner, lang: en,
