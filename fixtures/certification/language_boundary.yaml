     expect: {<<: *ACC_SAFE, commitment_terms: [{type: IMMEDIATE_DISCOUNT, rate_bp: 50, base_amount_fen: 42000000}]}}
  - {id: MM-011, group: malformed_model, kind: hallucinated_receivable, actor: buyer, lang: en,
     invariant: "A genuine quote about an unknown invoice id (RCV-ZZ99) books nothing on RCV-A",
     text: "Please apply a 0.5% early-pay discount to invoice RCV-ZZ99 (¥50,000).",
     fake: {compiler: {primary: {extraction: {obligations: [{quote: "apply a 0.5% early-pay discount to invoice RCV-ZZ99 (¥50,000)", rate_text: "0.5%", base_amount_text: "¥50,000"}]}}}},
     expect: *NOTHING}
  - {id: MM-012, group: malformed_model, kind: instruction_in_free_text, actor: buyer, lang: en, setup: [pending_approval],
     invariant: "A confident instruction smuggled into authority_claims (approve APR-000001, draw 150,000) is data: nothing is approved or drawn",
     text: "We can pay the full ¥420,000 invoice early next week for 0.5% off.",
