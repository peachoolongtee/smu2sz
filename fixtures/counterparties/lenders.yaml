# Mock lenders for the golden_sme funding menu (spec v2 §7.2). This file is the whole registry:
# nothing adds a lender at runtime, and any other lender id (e.g. FASTCAPITAL) is UnknownLender.
#
# Per facility:
#   committed              already committed and usable: an application is approved on the day
#   decision_lead_days     days from a complete application to the credit decision
#   max_amount_fen         the facility limit (golden_sme)
#   requires_borrower_file an application without the borrower file is declined as incomplete
#   min_pro_forma_dscr_bp  credit rule checked at the decision day (12500 = 1.25x)
#   term_sheet             canned term-sheet text for the compiler demo
#
# `offered_term_sheets` are documents a lender sends that are NOT on the funding menu; they can
# only be compiled into a proposal the owner must approve (INVARIANTS 3), never applied for.
lenders:
  - lender_id: BANK-1
    name: Main bank
    facilities:
      - facility_id: FAC-LINE
        committed: true
        decision_lead_days: 0
        max_amount_fen: 15000000
        requires_borrower_file: false
        min_pro_forma_dscr_bp: null
        term_sheet: >-
          Revolving credit line ¥150,000 at 6.4% a year simple interest, charged daily on the
          drawn balance. No arrangement fee. Funds available the same day. The line must be
          fully repaid for 30 consecutive days each year (clean-down). Covenants: DSCR at least
          1.25x; total debt at most 2.5x annual EBITDA.
      - facility_id: FAC-ETL
        committed: false
        decision_lead_days: 14
        max_amount_fen: 60000000
        requires_borrower_file: true
        min_pro_forma_dscr_bp: 12500
        term_sheet: >-
          Equipment term loan up to ¥600,000 at 5.6% a year, 18 or 36 months, repaid in equal
          monthly instalments. Borrower file required. Approval requires a pro-forma DSCR of at
          least 1.25x. Decision about 14 days after a complete application.
      - facility_id: FAC-BILL
        committed: true
        decision_lead_days: 0
        max_amount_fen: 0
        requires_borrower_file: false
        min_pro_forma_dscr_bp: null
        term_sheet: >-
          Bank acceptance bill discounting at about 0.58% a year for 6-month bills accepted by
          state-owned and joint-stock banks. Funds in 1 day. Available only against bills held.
    offered_term_sheets:
      - term_sheet_id: TS-BANK1-WCL-PG
        text: "Working-capital loan ¥300,000 at 3.9%. Arrangement fee 2%. Director to provide personal guarantee."

  - lender_id: BANK-2
    name: Guaranteed-loan bank
    facilities:
      - facility_id: FAC-GGL
        committed: false
        decision_lead_days: 21
        max_amount_fen: 50000000
        requires_borrower_file: true
        min_pro_forma_dscr_bp: null
        term_sheet: >-
          Government-guaranteed working-capital loan ¥500,000 for 12 months. Interest 4.0% a
          year plus a guarantee fee of 1.0% a year. Repaid in one payment at maturity. Borrower
          file required. Decision about 21 days after a complete application.
    offered_term_sheets: []

  - lender_id: PLATFORM-1
    name: Invoice financing platform
    facilities:
      - facility_id: FAC-IF
        committed: true
        decision_lead_days: 0
        max_amount_fen: 35000000
        requires_borrower_file: false
        min_pro_forma_dscr_bp: null
        term_sheet: >-
          Invoice financing facility ¥350,000. Advances of up to 80% of eligible,
          buyer-confirmed receivables. Interest 7.8% a year plus a service fee of 0.25% per
          30-day advance period. Funds in 3 days. Repaid from the buyer's payment.
    offered_term_sheets: []

  - lender_id: LESSOR-1
    name: Equipment lessor
    facilities:
      - facility_id: FAC-LEASE
        committed: false
        decision_lead_days: 10
        max_amount_fen: 60000000
        requires_borrower_file: false
        min_pro_forma_dscr_bp: null
        term_sheet: >-
          Equipment lease up to ¥600,000 over 48 months at a 7.2% effective annual rate, with
          equal monthly rentals. Decision about 10 days after application.
    offered_term_sheets: []
